<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SonicKeys - Drums</title>

        <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icon CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Custom Css Styles -->
    <link rel="stylesheet" href="/css/drums.css">
</head>
<body>
    <section class="playArea">
        <div class="drumKit position-relative">
            <img src="/assets/images/drums/CrashCymbal.png" class="drumInstrument" id="crash1">
            <img src="/assets/images/drums/CrashCymbal.png" class="drumInstrument" id="crash2">
            <img src="/assets/images/drums/HI-HAT.png" class="drumInstrument" id="hiHat1">
            <img src="/assets/images/drums/SnareDrum.png" class="drumInstrument" id="snareDrum1">
            <img src="/assets/images/drums/BaseDrum.png" class="drumInstrument" id="baseDrum1">
            <img src="/assets/images/drums/FloorTom.png" class="drumInstrument" id="floorTom">
            <img src="/assets/images/drums/RideCymbal.png" class="drumInstrument" id="rideCymbal">
            <img src="/assets/images/drums/HighTom.png" class="drumInstrument" id="highTom">
            <img src="/assets/images/drums/MiddleTom.png" class="drumInstrument" id="middleTom">
        </div>
    </section>


    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Tone.js CDN -->
    <script src="js/tone.js"></script>
    <script src="https://unpkg.com/tone@15.1.22/build/Tone.js"></script>
    <!-- Custom JS scripts -->
    <script src="/js/piano.js"></script>

</html>
