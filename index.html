<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play your Piano</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icon CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Custom Css Styles -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <section class="playArea">
        <div class="piano d-flex justify-content-center align-items-center">
            <div class="whiteKeysContainer d-flex gap-1 position-relative">
                
            <!-- White Keys and Black Keys -->

            <div class="whiteKeys" id="wKey1" data-note="C4" data-key="a" tabindex="0"></div>
            <div class="blackKeys" id="bKey1" data-note="C#4" data-key="w" tabindex="0"></div>

            <div class="whiteKeys" id="wKey2" data-note="D4" data-key="s" tabindex="0"></div>
            <div class="blackKeys" id="bKey2" data-note="D#4" data-key="e" tabindex="0"></div>

            <div class="whiteKeys" id="wKey3" data-note="E4" data-key="d" tabindex="0"></div>

            <div class="whiteKeys" id="wKey4" data-note="F4" data-key="f" tabindex="0"></div>
            <div class="blackKeys" id="bKey3" data-note="F#4" data-key="t" tabindex="0"></div>

            <div class="whiteKeys" id="wKey5" data-note="G4" data-key="g" tabindex="0"></div>
            <div class="blackKeys" id="bKey4" data-note="G#4" data-key="y" tabindex="0"></div>

            <div class="whiteKeys" id="wKey6" data-note="A4" data-key="h" tabindex="0"></div>
            <div class="blackKeys" id="bKey5" data-note="A#4" data-key="u" tabindex="0"></div>

            <div class="whiteKeys" id="wKey7" data-note="B4" data-key="j" tabindex="0"></div>

            <div class="whiteKeys" id="wKey8" data-note="C5" data-key="k" tabindex="0"></div>
            <div class="blackKeys" id="bKey6" data-note="C#5" data-key="o" tabindex="0"></div>

            <div class="whiteKeys" id="wKey9" data-note="D5" data-key="l" tabindex="0"></div>
            <div class="blackKeys" id="bKey7" data-note="D#5" data-key="p" tabindex="0"></div>

            <div class="whiteKeys" id="wKey10" data-note="E5" data-key=";" tabindex="0"></div>

            <div class="whiteKeys" id="wKey11" data-note="F5" data-key="'" tabindex="0"></div>

                
            </div>
        </div>
    </section>
</body>


<!-- Bootstrap JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<!-- JQuery CDN -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Custom JS scripts -->
<script src="/js/scripts.js"></script>
</html>
