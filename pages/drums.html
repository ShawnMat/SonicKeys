<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SonicKeys - Drums</title>

        <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icon CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Custom Css Styles -->
    <link rel="stylesheet" href="../css/drums.css">
</head>
<body>
    <section class="playArea">
        <div class="drumKit position-relative">
            <img src="../assets/images/drums/CrashCymbal.png" class="drumInstrument" id="crash1" draggable="false">
            <img src="../assets/images/drums/CrashCymbal.png" class="drumInstrument" id="crash2" draggable="false">
            <img src="../assets/images/drums/hiHat.png" class="drumInstrument" id="hiHat" draggable="false">
            <img src="../assets/images/drums/SnareDrum.png" class="drumInstrument" id="snareDrum" draggable="false">
            <img src="../assets/images/drums/BaseDrum.png" class="drumInstrument" id="baseDrum" draggable="false">
            <img src="../assets/images/drums/FloorTom.png" class="drumInstrument" id="floorTom" draggable="false">
            <img src="../assets/images/drums/RideCymbal.png" class="drumInstrument" id="rideCymbal" draggable="false">
            <img src="../assets/images/drums/HighTom.png" class="drumInstrument" id="highTom" draggable="false">
            <img src="../assets/images/drums/MiddleTom.png" class="drumInstrument" id="middleTom" draggable="false">
        </div>
    </section>
    <div id="rotateOverlay">
        <div class="rotateBox">
            <i class="bi bi-phone-landscape fs-1"></i>
            <h3>Rotate Your Device</h3>
            <p>Change to landscape mode for a better musical experience.</p>
        </div>
    </div>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Tone.js CDN -->
    <script src="../js/tone.js"></script>
    <!-- Custom JS scripts -->
    <script src="../js/drum.js"></script>
</body>
</html>
