<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SonicKeys - Drums</title>

        <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icon CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Custom Css Styles -->
    <link rel="stylesheet" href="../css/drums.css">
</head>
<body>
    <div class="controls p-3">
        <i class="bi bi-volume-up-fill"></i>
        <input type="range" id="volumeSlider" min="-40" max="0" value="-8" step="1">
    </div>
    <section id="drumPad">
        <div class="container drumPadCont">
            <div class="card">
                <img src="../assets/images/drums/crashcymbal.png" class="drumPart" id="crash1" draggable="false">
                <p>Crash Cymbal</p>
            </div>
            <div class="card">
                <img src="../assets/images/drums/hihat.png" class="drumPart" id="hiHat" draggable="false">
                <p>Hi-Hat</p>
            </div>
            <div class="card">
                <img src="../assets/images/drums/crashcymbal.png" class="drumPart" id="crash2" draggable="false">
                <p>Crash Cymbal</p>
            </div>
            <div class="card">
                <img src="../assets/images/drums/snaredrum.png" class="drumPart" id="snareDrum" draggable="false">
                <p>Snare Drum</p>
            </div>
            <div class="card">
                <img src="../assets/images/drums/basedrum.png" class="drumPart" id="baseDrum" draggable="false">
                <p>Base Drum</p>
            </div>
            <div class="card">
                <img src="../assets/images/drums/floortom.png" class="drumPart" id="floorTom" draggable="false">
                <p>Floor Tom</p>
            </div>
            <div class="card">
                <img src="../assets/images/drums/ridecymbal.png" class="drumPart" id="rideCymbal" draggable="false">
                <p>Ride Cymbal</p>
            </div>
            <div class="card">
                <img src="../assets/images/drums/hightom.png" class="drumPart" id="highTom" draggable="false">
                <p>High Tom</p>
            </div>
            <div class="card">
                <img src="../assets/images/drums/middletom.png" class="drumPart" id="middleTom" draggable="false">
                <p>Middle Tom</p>
            </div>
        </div>
    </section>




    <div id="rotateOverlay">
        <div class="rotateBox">
            <i class="bi bi-phone-landscape fs-1"></i>
            <h3>Rotate Your Device</h3>
            <p>Change to landscape mode for a better musical experience.</p>
        </div>
    </div>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Tone.js CDN -->
    <script src="../js/tone.js"></script>
    <!-- Custom JS scripts -->
    <script src="../js/drum.js"></script>
</body>
</html>
